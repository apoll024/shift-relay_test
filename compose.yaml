services:
  relay:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - '127.0.0.1:8090:8090'
    volumes:
      - relay-data:/data
    env_file:
      - .env.server
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8090/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  relay-data:
